# Local development: the Astro dev server, served at https://etc-website.puremint.xyz by
# Caddy in ~/infra (see ~/infra/README.md). `docker compose up -d` starts it.
services:
  app:
    build:
      # The node_modules volume takes its owner from this directory, so `node`
      # can install into it.
      dockerfile_inline: |
        FROM node:22-alpine
        RUN mkdir -p /app/node_modules && chown -R node:node /app
        USER node
        WORKDIR /app
    command: sh -c "npm ci && npm run dev"
    restart: unless-stopped
    volumes:
      - .:/app
      # Keep the container's Linux node_modules out of the host checkout.
      - node_modules:/app/node_modules
    # Caddy in ~/infra routes etc-website.puremint.xyz to this port.
    ports:
      - 127.0.0.1:8010:4321

volumes:
  node_modules:
